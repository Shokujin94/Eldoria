services:
  eldoria:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      - eldoria-data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  eldoria-data:
