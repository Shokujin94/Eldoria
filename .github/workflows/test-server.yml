name: Testar servidor Eldoria
on:
  pull_request:
    paths: ['server/**', 'js/49-modelo.js', 'js/50-oficios-modelo.js', '.github/workflows/test-server.yml']
  push:
    branches: [main]
    paths: ['server/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: server

      - run: npm run load:http -- 12 8
        working-directory: server

      - run: npm run load:http -- 40 10
        working-directory: server
      - run: bash -n scripts/beta-backup.sh scripts/beta-update.sh scripts/beta-restore.sh

      - run: bash scripts/test-beta-backup.sh

      - run: bash -n scripts/share-start.sh scripts/share-stop.sh scripts/share-status.sh
