
name: Publicar Eldoria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Definir artefato exclusivo
        id: artifact
        run: |
          echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Preparar publicacao
        shell: bash
        run: |
          BASE=$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')
          python3 tools/publicar.py --versao "${BASE}-gh${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" --saida public
          python3 tools/verificar_publicacao.py public

      - name: Enviar arquivos publicos
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: public
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Aguardar disponibilidade do artefato
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in $(seq 1 24); do
            COUNT=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              -f name="$ARTIFACT_NAME" \
              --method GET \
              --jq '[.artifacts[] | select(.expired == false)] | length' \
              2>/dev/null || echo 0)

            if [ "$COUNT" = "1" ]; then
              echo "Artefato encontrado com sucesso."
              sleep 15
              exit 0
            fi

            echo "Aguardando artefato. Tentativa $attempt de 24."
            sleep 10
          done

          echo "::error::Artefato indisponivel ou duplicado."
          exit 1

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
